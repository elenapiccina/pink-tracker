<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker 🚀</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
            --card-bg: rgba(255, 255, 255, 0.7);
            --pink-dark: #d47a84;
            --pink-light: #ffb6c1;
            --text-main: #5c4749;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .tracker-container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 8px 32px 0 rgba(220, 180, 185, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--pink-dark);
            letter-spacing: 0.5px;
        }

        .btn-reset {
            background: rgba(214, 122, 132, 0.15);
            color: var(--pink-dark);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-reset:hover { background: rgba(214, 122, 132, 0.25); }

        .task-input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            border: 1px solid rgba(212, 122, 132, 0.3);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
        }

        input::placeholder { color: #bcaeb0; }

        button.btn-add {
            background: var(--pink-dark);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button.btn-add:hover { opacity: 0.9; }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(212, 122, 132, 0.1);
        }

        .task-info {
            display: flex;
            flex-direction: column;
        }

        .task-name { font-weight: 500; font-size: 0.95rem; }
        .task-time { font-size: 0.85rem; color: #8e797b; margin-top: 2px; }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-control {
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-play { background: #e3f9e5; color: #2e7d32; }
        .btn-play.active { background: #fff3cd; color: #856404; }
        .btn-stop { background: #f8d7da; color: #721c24; }
        .btn-delete { background: rgba(212, 122, 132, 0.1); color: var(--pink-dark); }
    </style>
</head>
<body>

<div class="tracker-container">
    <div class="header-area">
        <h2>Time Tracker 🚀</h2>
        <button class="btn-reset" onclick="resetAll()">🔄 Reset All</button>
    </div>
    
    <div class="task-input-box">
        <input type="text" id="taskInput" placeholder="Enter task name...">
        <button class="btn-add" onclick="addTask()">Add</button>
    </div>
    
    <div class="task-list" id="taskList"></div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('notion_tasks_v3')) || [];
    let activeTaskId = null;
    let timerInterval = null;

    function formatTime(totalSeconds) {
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        return `${hours}:${minutes}:${secs}`;
    }

    function saveAndRender() {
        localStorage.setItem('notion_tasks_v3', JSON.stringify(tasks));
        const listEl = document.getElementById('taskList');
        listEl.innerHTML = '';

        tasks.forEach(task => {
            const item = document.createElement('div');
            item.className = 'task-item';
            
            const isActive = task.id === activeTaskId;

            item.innerHTML = `
                <div class="task-info">
                    <span class="task-name">${task.name}</span>
                    <span class="task-time">${formatTime(task.seconds)}</span>
                </div>
                <div class="action-btns">
                    ${isActive ? 
                        `<button class="btn-control btn-stop" onclick="stopTask()">🛑 Stop</button>` : 
                        `<button class="btn-control btn-play" onclick="startTask(${task.id})">▶ Play</button>`
                    }
                    <button class="btn-control btn-delete" onclick="deleteTask(${task.id})">✕</button>
                </div>
            `;
            listEl.appendChild(item);
        });
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        if (!input.value.trim()) return;
        
        tasks.push({
            id: Date.now(),
            name: input.value.trim(),
            seconds: 0
        });
        input.value = '';
        saveAndRender();
    }

    function startTask(id) {
        clearInterval(timerInterval);
        activeTaskId = id;
        timerInterval = setInterval(() => {
            const task = tasks.find(t => t.id === activeTaskId);
            if (task) {
                task.seconds++;
                saveAndRender();
            }
        }, 1000);
        saveAndRender();
    }

    function stopTask() {
        clearInterval(timerInterval);
        activeTaskId = null;
        saveAndRender();
    }

    function deleteTask(id) {
        if (activeTaskId === id) {
            stopTask();
        }
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
    }

    function resetAll() {
        if (confirm("Clear all your tracked tasks?")) {
            stopTask();
            tasks = [];
            saveAndRender();
        }
    }

    // Allow hitting "Enter" to add tasks
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addTask();
    });

    saveAndRender();
</script>

</body>
</html>
