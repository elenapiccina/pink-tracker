<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker ⚡️</title>
    <style>
        :root {
            --pink-header: #f25c8a;
            --pink-bg: #fff0f3;
            --pink-text: #b83b5e;
            --text-dark: #4a3b3d;
            --card-white: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--pink-bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .widget-container {
            width: 100%;
            max-width: 550px;
            background: var(--card-white);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(242, 92, 138, 0.1);
            overflow: hidden;
            margin: 16px;
        }

        /* Top Header Bar */
        .header-bar {
            background-color: var(--pink-header);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-header-reset {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-header-reset:hover { background: rgba(255, 255, 255, 0.35); }

        /* Main Counter Display Block */
        .main-display {
            padding: 16px;
            border-bottom: 1px solid #ffe3e8;
        }

        .active-timer {
            font-size: 2rem;
            font-weight: bold;
            color: var(--pink-text);
            margin: 0;
        }

        .timeline-label {
            display: flex;
            justify-content: flex-end;
            font-size: 0.8rem;
            color: #bfa3a7;
            margin-top: -10px;
        }

        /* Task Row Layout */
        .task-list {
            padding: 8px 16px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #fff0f2;
        }

        .task-item:last-child { border-bottom: none; }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-trigger {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff0f3;
            border: 1px solid #ffd1dc;
            color: var(--pink-text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .play-trigger.active {
            background: #e3f9e5;
            border-color: #a3e0a8;
            color: #2e7d32;
        }

        .task-details {
            display: flex;
            flex-direction: column;
        }

        .task-name {
            font-weight: 500;
            color: var(--pink-text);
            font-size: 0.95rem;
        }

        .task-meta {
            font-size: 0.75rem;
            color: #a39294;
            margin-top: 2px;
        }

        .task-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .task-duration {
            font-weight: bold;
            color: var(--pink-text);
            font-size: 1rem;
            min-width: 65px;
            text-align: right;
        }

        .control-actions-group {
            display: flex;
            gap: 4px;
        }

        .btn-action {
            background: none;
            border: none;
            color: #a39294;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .btn-action:hover {
            background: #fff0f2;
            color: var(--pink-text);
        }

        /* Input Bar Layout */
        .input-bar {
            display: flex;
            border-top: 1px solid #ffe3e8;
            background: #fafafa;
        }

        .input-bar input {
            flex: 1;
            border: none;
            padding: 14px 16px;
            outline: none;
            font-size: 0.9rem;
            background: transparent;
        }
        .input-bar input::placeholder { color: #ccbdc0; }

        .btn-add {
            background: var(--pink-header);
            color: white;
            border: none;
            padding: 0 24px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-add:hover { opacity: 0.9; }

        /* Archive View Drawer */
        .archive-section {
            background: #fafafa;
            border-top: 1px solid #ffe3e8;
            padding: 12px 16px;
        }
        .archive-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #a39294;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .archive-item {
            font-size: 0.85rem;
            color: #736264;
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }
    </style>
</head>
<body>

<div class="widget-container">
    <!-- Header -->
    <div class="header-bar">
        <div class="header-title">Time Tracker ⚡️</div>
        <div class="header-controls">
            <button class="btn-header-reset" onclick="resetAll()">🔄 Reset All</button>
        </div>
    </div>

    <!-- Main Counter Block -->
    <div class="main-display">
        <div class="active-timer" id="globalDisplay">0:00:00</div>
        <div class="timeline-label">today</div>
    </div>

    <!-- Tasks List Area -->
    <div class="task-list" id="taskList"></div>

    <!-- Bottom Input Area -->
    <div class="input-bar">
        <input type="text" id="taskInput" placeholder="add a task — e.g. deep work">
        <button class="btn-add" onclick="addTask()">Add</button>
    </div>

    <!-- Archive Storage View -->
    <div class="archive-section" id="archiveSection" style="display: none;">
        <div class="archive-title">📦 Archived History</div>
        <div id="archiveList"></div>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('notion_tracker_v2')) || [];
    let archive = JSON.parse(localStorage.getItem('notion_archive_v2')) || [];
    let activeTaskId = null;
    let timerInterval = null;

    function formatTime(totalSeconds) {
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(1, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        return `${hours}:${minutes}:${secs}`;
    }

    function saveAndRender() {
        localStorage.setItem('notion_tracker_v2', JSON.stringify(tasks));
        localStorage.setItem('notion_archive_v2', JSON.stringify(archive));
        
        const listEl = document.getElementById('taskList');
        listEl.innerHTML = '';

        // Update active top counter block display
        const activeTask = tasks.find(t => t.id === activeTaskId);
        document.getElementById('globalDisplay').innerText = activeTask ? formatTime(activeTask.seconds) : "0:00:00";

        tasks.forEach(task => {
            const item = document.createElement('div');
            item.className = 'task-item';
            const isActive = task.id === activeTaskId;

            item.innerHTML = `
                <div class="task-left">
                    <button class="play-trigger ${isActive ? 'active' : ''}" onclick="toggleTask(${task.id})">
                        ${isActive ? '⏸' : '▶'}
                    </button>
                    <div class="task-details">
                        <span class="task-name">${task.name}</span>
                        <span class="task-meta">tracked today</span>
                    </div>
                </div>
                <div class="task-right">
                    <span class="task-duration">${formatTime(task.seconds)}</span>
                    <div class="control-actions-group">
                        <button class="btn-action" title="Stop & Archive" onclick="stopAndArchiveTask(${task.id})">🛑 Stop & Archive</button>
                        <button class="btn-action" title="Delete" onclick="deleteTask(${task.id})">✕</button>
                    </div>
                </div>
            `;
            listEl.appendChild(item);
        });

        // Handle Archive UI render block
        const archiveSection = document.getElementById('archiveSection');
        const archiveList = document.getElementById('archiveList');
        if (archive.length > 0) {
            archiveSection.style.display = 'block';
            archiveList.innerHTML = '';
            archive.forEach(item => {
                const div = document.createElement('div');
                div.className = 'archive-item';
                div.innerHTML = `<span>✅ ${item.name}</span> <span>${formatTime(item.seconds)}</span>`;
                archiveList.appendChild(div);
            });
        } else {
            archiveSection.style.display = 'none';
        }
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        if (!input.value.trim()) return;
