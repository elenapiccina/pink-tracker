<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker 🚀</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff0f3;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .tracker-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(242, 92, 138, 0.06);
            box-sizing: border-box;
        }

        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 24px;
        }

        .title {
            color: #d46b79;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reset {
            position: absolute;
            right: 0;
            background: none;
            border: none;
            color: #d46b79;
            font-size: 0.8rem;
            cursor: pointer;
            opacity: 0.6;
            padding: 4px;
        }
        .btn-reset:hover { opacity: 1; }

        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        input {
            flex: 1;
            border: 1px solid #ebd6da;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: #4a3b3d;
            outline: none;
            background: #ffffff;
        }
        input::placeholder { color: #ccbdc0; }

        .btn-add {
            background-color: #d46b79;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-add:hover { opacity: 0.9; }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            border: 1px solid #fcf0f2;
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(242, 92, 138, 0.02);
        }

        .task-details {
            display: flex;
            flex-direction: column;
        }

        .task-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a3b3d;
            margin-bottom: 4px;
        }

        .task-time {
            font-size: 0.95rem;
            color: #a39294;
            font-variant-numeric: tabular-nums;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-control {
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            min-width: 75px;
            text-align: center;
        }

        .btn-play { background-color: #a7cca9; color: white; }
        .btn-stop { background-color: #e8a7b0; color: white; }

        .btn-delete {
            background-color: #fdf2f4;
            color: #d46b79;
            border: none;
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-delete:hover { background-color: #fbdde2; }
    </style>
</head>
<body>

<div class="tracker-card">
    <div class="header-container">
        <h1 class="title">Time Tracker 🚀</h1>
        <button class="btn-reset" onclick="resetAll()">Clear All</button>
    </div>

    <div class="input-row">
        <input type="text" id="taskInput" placeholder="Enter task name...">
        <button class="btn-add" onclick="addTask()">Add</button>
    </div>

    <div class="task-list" id="taskList"></div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('notion_tasks_final')) || [];
    let activeTaskId = null;
    let timerInterval = null;

    function formatTime(totalSeconds) {
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        return `${hours}:${minutes}:${secs}`;
    }

    function saveAndRender() {
        localStorage.setItem('notion_tasks_final', JSON.stringify(tasks));
        const listEl = document.getElementById('taskList');
        listEl.innerHTML = '';

        tasks.forEach(task => {
            const item = document.createElement('div');
            item.className = 'task-item';
            const isActive = task.id === activeTaskId;

            item.innerHTML = `
                <div class="task-details">
                    <span class="task-name">${task.name}</span>
                    <span class="task-time">${formatTime(task.seconds)}</span>
                </div>
                <div class="action-group">
                    ${isActive ? 
                        `<button class="btn-control btn-stop" onclick="stopTask()">Stop</button>` : 
                        `<button class="btn-control btn-play" onclick="startTask(${task.id})">Play</button>`
                    }
                    <button class="btn-delete" onclick="deleteTask(${task.id})">✕</button>
                </div>
            `;
            listEl.appendChild(item);
        });
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        if (!input.value.trim()) return;
        
        tasks.push({
            id: Date.now(),
            name: input.value.trim(),
            seconds: 0
        });
        input.value = '';
        saveAndRender();
    }

    function startTask(id) {
        clearInterval(timerInterval);
        activeTaskId = id;
        timerInterval = setInterval(() => {
            const task = tasks.find(t => t.id === activeTaskId);
            if (task) {
                task.seconds++;
                saveAndRender();
            }
        }, 1000);
        saveAndRender();
    }

    function stopTask() {
        clearInterval(timerInterval);
        activeTaskId = null;
        saveAndRender();
    }

    function deleteTask(id) {
        if (activeTaskId === id) stopTask();
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
    }

    function resetAll() {
        if (confirm("Reset everything?")) {
            stopTask();
            tasks = [];
            saveAndRender();
        }
    }

    document.getElementById('taskInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addTask();
    });

    saveAndRender();
</script>

</body>
</html>
